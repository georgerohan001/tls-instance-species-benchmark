# Example layout matching the Ettenheim thesis evaluation (tiles 001-004).
# Fill data/ettenheim/ with inputs obtained separately — nothing is shipped.
# Example values are illustrative; runtime does not hard-code this site_id.

site_id: ettenheim
title: Ettenheim
data_root: data/ettenheim

tiles: [1, 2, 3, 4]

aligned: aligned/x_eval.npz
gt_layers_dir: gt_layers

fm_laz: inputs/forestmamba.laz
sat_laz: inputs/galaxy_sat_final.laz
detailview_laz: inputs/manual_SAT_FM_BP1_v2_final.laz

match_csv: inputs/matched_trees_cleaned_las_index.csv
enriched_match_csv: inputs/matched_layers_enriched_las_index.csv
inventory: inputs/inventory.gpkg
inventory_layer: final_inventory_export_safia
inventory_id_col: full_id
